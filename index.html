<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>차곡 — 나만의 가계부</title><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head><body><aside><a class="brand" href="#">▦ 차곡<span>나만의 가계부</span></a><small>MY FINANCE</small><nav id="nav"></nav><div class="aside-bottom"><div class="privacy-badge">🔒 나만 보는 가계부</div><p id="currentUser" class="muted" aria-live="polite"></p><button id="lockNow">🔒 잠그기 / 로그아웃</button><button id="reloadServer">↻ 최신 기록 불러오기</button><button id="localMigration" hidden>기존 브라우저 기록 가져오기</button><b>작은 기록, 단단한 일상.</b><p>기록은 암호화되어 내 비공개 GitHub 저장소에 저장돼요. 어느 기기에서 열어도 같은 기록이 보여요.</p><button id="backup">↓ 데이터 백업</button><button id="restore">↑ 데이터 불러오기</button><input type="file" id="file" accept=".json" hidden><p id="saveState">잠겨 있음</p></div></aside><main><header><div><small>MY PRIVATE LEDGER</small><h1 id="title"></h1><p id="subtitle"></p></div><button class="primary" id="add">＋ 지출 기록</button></header><div class="toolbar"><div><button id="prev" aria-label="이전 달">‹</button><input id="month" aria-label="조회 월" type="month" value="2026-10"><button id="next" aria-label="다음 달">›</button></div><div><select id="basis" aria-label="집계 기준"><option value="21">가계부 월 · 21일 시작</option><option value="1">달력 월 · 1일 시작</option></select><span class="pill">자동 집계</span></div></div><div id="syncWarning" class="notice" hidden></div><button id="retrySave">저장 재시도</button><div id="content"></div><footer>차곡 · 나에게 맞는 돈의 흐름 <span>모든 그래프는 ‘적금’ 분류 제외 · 단위 원</span></footer></main><dialog id="dialog"><form id="form"><div class="dialog-head"><h2 id="dialogTitle"></h2><button type="button" id="close" aria-label="닫기">✕</button></div><div id="fields"></div><p id="formError" role="alert"></p><button class="primary" type="submit">저장하기</button></form></dialog><div id="toast" role=
